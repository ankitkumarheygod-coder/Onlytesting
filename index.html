<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Land — Learning Engine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="view-dashboard" class="view active">
        <h1>सीखने की प्रगति (Dashboard)</h1>
        <div id="dashboard-content"></div>
        <button id="start-revision-btn">Start Revision</button>
        <p id="normal-mode-msg" style="display:none">यहाँ Normal Mode का Content आएगा।</p>
    </div>

    <div id="view-quiz" class="view">
        <h2 id="quiz-progress">Question: 1 / 50</h2>
        <div id="quiz-container"></div>
    </div>

    <div id="error-screen" class="view">
        <h1>⚠️ Content में समस्या मिली</h1>
        <p id="error-msg"></p>
    </div>

    <div id="notes-modal"></div>
    <div id="debug-panel"></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
